[workspace]
resolver = "2"
members = ["shared-protocol", "supervisor", "node-daemon", "bridge", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
ocl-protocol = { path = "shared-protocol" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
futures = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2", "service"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tonic = "0.13"
prost = "0.13"
tonic-build = "0.13"
protoc-bin-vendored = "3"
notify = "6"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
time = "0.3"
ipnet = { version = "2", features = ["serde"] }
blake3 = "1.5"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }
globset = { version = "0.4", default-features = false }
walkdir = "2"
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
rust-embed = { version = "8", features = ["debug-embed"] }
instant-acme = { version = "0.7", default-features = false, features = ["ring", "hyper-rustls"] }
httparse = "1"
ratatui = "0.29"
crossterm = "0.28"
